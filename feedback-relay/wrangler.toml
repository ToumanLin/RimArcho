# RimArcho's feedback relay (README.md), deployed at rimarcho-feedback.toumanlin.workers.dev.
# After changing this file: `npx wrangler deploy`.
name = "rimarcho-feedback"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
REPO = "ToumanLin/RimArcho"
APP_ID = "5556617"            # the GitHub App's App ID (README step 2)
LABEL = "feedback"     # put on each issue; dropped when GitHub refuses it
PER_IP_DAY = "5"       # reports a day from one sender
PER_DAY = "30"         # reports a day from everyone; 0 stops sending

# daily counters and the contacts senders leave (README step 3)
[[kv_namespaces]]
binding = "COUNTS"
id = "78f113b31b2744a4bccd1184ecb10ebc"

# one report a minute and PER_IP_DAY a day per sender, exact: a Durable Object per sender
# (SendGate in worker.mjs; SQLite storage, on the free plan). It replaced the approximate
# rate-limit binding PER_MINUTE after the 1.0.6 VM round.
[[durable_objects.bindings]]
name = "GATE"
class_name = "SendGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SendGate"]

# secret, never in this file: GITHUB_APP_KEY, the App's private key (README step 4)
