<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>play review · E Shelf and album</title>
<link rel="stylesheet" href="shared.css">
<style>
  #page { overflow-y: auto; padding-bottom: 16px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .bar .find { flex: 0 1 220px; margin-left: auto; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px 12px; }
  .bk { display: block; width: 100%; padding: 6px; border-radius: 12px; }
  .bk:hover { background: var(--pill); }
  .bk .ft { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 0 2px; }
  .bk .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--fg-2); }
  .bk:hover .n { color: var(--fg); }
  .more-row { margin: 18px 2px 0; font-size: 12px; color: var(--muted); }
  /* the album: one Mod, its things as pictures */
  .ahead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .ahead .cover { width: 160px; flex: none; }
  .ahead h2 { margin: 0 0 6px; font-size: 18px; }
  .ahead .acts { margin-left: auto; display: flex; gap: 6px; align-self: flex-start; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tab { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px 0 8px; border-radius: 10px; color: var(--ctl-fg); background: var(--pill); font-size: 12.5px; }
  .tab .g { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .grid .it { width: 52px; height: 52px; } .grid .it .g { width: 28px; height: 28px; }
  .sec { margin-top: 14px; } .sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="review" id="review"></div>
<div id="app">
  <aside id="side"><div class="side-head">RimArcho</div><nav id="nav"></nav></aside>
  <main id="main">
    <div id="top"></div><div class="page-head" id="head"></div>
    <div id="page" class="narrow"><div id="view"></div></div>
    <div id="bottom"><span id="status"></span><span id="hints"></span></div>
  </main>
</div>
<div id="toast"></div>
<script src="shared.js"></script>
<script>
shell("e", [["/", "find"], ["enter", "open"], ["esc", "back"]]);
$("#head .lead").innerHTML = "What you have and have not tried";
let st = "", q = "", cur = null, tab = "", unseen = false;
const content = MODS.filter((m) => !m.functional);
function shelf() {
  const ms = content.filter((m) => (!st || state(m) === st) && m.name.toLowerCase().includes(q)).sort((a, b) => share(a) - share(b) || b.adds - a.adds);
  const n = (k) => content.filter((m) => state(m) === k).length;
  $("#view").innerHTML = `<div class="bar">
      <button class="pill ${st === "" ? "on" : ""}" data-st="">all</button>
      ${STATES.slice(0, 3).map(([k, t]) => `<button class="pill ${st === k ? "on" : ""}" data-st="${k}" title="${t}"><span class="sdot ${k}"></span>${n(k)}</button>`).join("")}
      <label class="find"><span>${ic("search")}</span><input id="q" placeholder="Find" value="${esc(q)}" autocomplete="off"></label></div>
    <div class="shelf">${ms.map((m) => `<button class="bk" data-m="${m.id}" title="${esc(m.name)}: ${m.seen} of ${m.adds} seen">${cover(m)}<span class="ft"><span class="n">${esc(m.name)}</span>${ring(m.seen, m.adds, 22)}</span></button>`).join("")}</div>
    <p class="more-row">${MODS.length - content.length} more Mods add nothing a save can show.</p>`;
  $("#q").oninput = (e) => { q = e.target.value.toLowerCase(); shelf(); const i = $("#q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
}
function album() {
  const m = cur, cs = [...m.cats].sort((a, b) => b.adds - a.adds);
  const shown = tab ? cs.filter((c) => c.key === tab) : cs;
  $("#view").innerHTML = `<div class="ahead">${cover(m)}<div><h2>${esc(m.name)}</h2><div style="display:flex;align-items:center;gap:10px">${ring(m.seen, m.adds, 34)}<span class="muted">${m.seen} of ${m.adds.toLocaleString()} seen</span></div></div>
      <div class="acts"><button class="btn line small" id="back">${ic("x")} Back</button><button class="btn line small" data-toast="would open it in the Mod library">Mod library</button></div></div>
    <div class="tabs"><button class="tab ${tab === "" ? "on" : ""}" data-tab="">all</button>${cs.map((c) => `<button class="tab ${tab === c.key ? "on" : ""}" data-tab="${c.key}" title="${CAT_LABEL[c.key]}">${glyph(c.key)}${CAT_LABEL[c.key]}${ring(c.seen, c.adds, 18)}</button>`).join("")}
      <button class="tab ${unseen ? "on" : ""}" id="unseen" style="margin-left:auto">only not seen</button></div>
    ${shown.map((c) => `<section class="sec">${tab ? "" : `<h3>${CAT_LABEL[c.key]}${ring(c.seen, c.adds, 16)}</h3>`}<div class="grid">${tiles(m, c, tab ? 0 : 44, unseen)}</div></section>`).join("")}`;
  $("#back").onclick = () => { cur = null; shelf(); };
  $("#unseen").onclick = () => { unseen = !unseen; album(); };
}
$("#view").onclick = (e) => {
  const s = e.target.closest("[data-st]"), b = e.target.closest("[data-m]"), t = e.target.closest("[data-tab]");
  if (s) { st = s.dataset.st; shelf(); } else if (b) { cur = MODS.find((m) => m.id === b.dataset.m); tab = ""; album(); $("#page").scrollTop = 0; } else if (t) { tab = t.dataset.tab; album(); }
};
addEventListener("keydown", (e) => { if (e.key === "Escape" && cur) { cur = null; shelf(); } else if (e.key === "/" && !cur && document.activeElement?.id !== "q") { e.preventDefault(); $("#q").focus(); } });
$("#status").textContent = "E: a shelf of covers, the least tried first; grey covers were never touched. A cover opens its album: things in colour were seen, outlines were not; the name is in the hover.";
shelf();
</script>
</body>
</html>
