<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>列表管理草案</title>
<style>
/* Tokens are the GUI's own (internal/surface/gui/assets/style.css, from magpie, MIT). */
:root {
  --card-gap: 4px;
  --bg: #f4f4f6; --card: #ffffff; --card-2: #f9f9fb; --pill: #f1f1f4; --pill-hover: #e9e9ee;
  --seg-thumb: var(--card); --seg-edge: 0 1px 2px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.08);
  --ctl-fg: #63636b; --line: #e3e3e8; --line-2: #ececf0; --fg: #1c1c21; --fg-2: #4b4b53;
  --muted: #85858d; --faint: #b9b9c2; --accent: #4f46e5; --accent-soft: #eeedfd; --accent-fg: #fff;
  --sel: #ecebfb; --green: #189a58; --green-soft: #e4f6ec; --red: #d64545; --red-soft: #fbe9e9;
  --amber: #b45309; --amber-soft: #fbf0df;
  --shadow: 0 16px 44px rgba(20,22,30,.16), 0 2px 8px rgba(20,22,30,.06), 0 0 0 .5px rgba(20,22,30,.1);
  --ease: cubic-bezier(.2,.8,.2,1); --t-press: 120ms; --t-enter: 180ms;
  --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --code: "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a1e; --card: #232327; --card-2: #1f1f23; --pill: #2d2d33; --pill-hover: #36363d;
    --seg-thumb: rgba(255,255,255,.15); --seg-edge: inset 0 .5px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.3);
    --line: #333339; --line-2: #2c2c32; --fg: #ededf1; --fg-2: #b9b9c1; --muted: #8b8b94; --faint: #56565f; --ctl-fg: #a1a1aa;
    --accent: #a5b4fc; --accent-soft: #2b2c47; --accent-fg: #14142a; --sel: #33345a;
    --green: #6fd99b; --green-soft: #1e3a2b; --red: #f28b82; --red-soft: #45272a; --amber: #f2b544; --amber-soft: #3f3220;
    --shadow: 0 16px 44px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.3), 0 0 0 .5px rgba(255,255,255,.1);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a1e; --card: #232327; --card-2: #1f1f23; --pill: #2d2d33; --pill-hover: #36363d;
  --seg-thumb: rgba(255,255,255,.15); --seg-edge: inset 0 .5px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.3);
  --line: #333339; --line-2: #2c2c32; --fg: #ededf1; --fg-2: #b9b9c1; --muted: #8b8b94; --faint: #56565f; --ctl-fg: #a1a1aa;
  --accent: #a5b4fc; --accent-soft: #2b2c47; --accent-fg: #14142a; --sel: #33345a;
  --green: #6fd99b; --green-soft: #1e3a2b; --red: #f28b82; --red-soft: #45272a; --amber: #f2b544; --amber-soft: #3f3220;
  --shadow: 0 16px 44px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.3), 0 0 0 .5px rgba(255,255,255,.1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
body { display: grid; grid-template-rows: 40px minmax(0, 1fr); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input, textarea { font: inherit; color: var(--fg); background: transparent; border: 0; outline: 0; width: 100%; }
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
.muted { color: var(--muted); } .warn { color: var(--amber); } .ok { color: var(--green); }
kbd { font: 11px var(--font); color: var(--faint); margin-left: 6px; }

.review { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px dashed var(--line); background: var(--card-2); font-size: 12px; color: var(--muted); }
.review b { color: var(--fg); font-weight: 600; }
.review .sp { flex: 1; }
.review .rb { height: 26px; padding: 0 10px; border-radius: 6px; color: var(--ctl-fg); }
.review .rb:hover { background: var(--pill); color: var(--fg); }

#app { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 0; }
#side { display: flex; flex-direction: column; border-right: 1px solid var(--line-2); min-height: 0; }
.side-head { height: 50px; display: flex; align-items: center; padding: 0 10px; }
.navtoggle { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; color: var(--muted); }
#nav { flex: 1; padding: 2px 10px 10px; display: flex; flex-direction: column; gap: 1px; overflow: auto; }
.grp { padding: 14px 8px 4px; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .04em; }
.grp:first-child { padding-top: 2px; }
.nav-item { width: 100%; height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 7px; color: var(--fg-2); white-space: nowrap; text-align: left; }
.nav-item .ic { display: inline-flex; color: var(--muted); }
.nav-item:hover { background: var(--pill); color: var(--fg); }
.nav-item.open { color: var(--fg); font-weight: 500; }
.nav-item .chev { display: inline-flex; margin-left: -3px; color: var(--faint); }
.nav-item.open .chev { transform: rotate(90deg); }
.nav-item .chev svg.i { width: 10px; height: 10px; stroke-width: 1.8; }
.badge-n { margin: 0 -4px 0 auto; font-size: 11px; font-weight: 500; line-height: 17px; min-width: 17px; padding: 0 5px; border-radius: 999px; text-align: center; color: var(--amber); background: var(--amber-soft); }
.kids { position: relative; display: flex; flex-direction: column; gap: 1px; margin-left: 16px; padding: 3px 0 6px 8px; }
.kids::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 9px; width: 1px; background: var(--line); }
.nav-kid { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; color: var(--ctl-fg); font-size: 12.5px; white-space: nowrap; text-align: left; }
.nav-kid:hover:not(.on) { color: var(--fg); }
.nav-kid.on { color: var(--fg); font-weight: 600; background: color-mix(in srgb, var(--fg) 6.5%, transparent); }
.side-foot { padding: 8px 10px 10px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 6px; }

#main { display: grid; grid-template-rows: 50px auto minmax(0, 1fr) 30px; min-width: 0; min-height: 0; }
#top { display: flex; align-items: center; gap: 8px; padding: 0 16px 0 12px; }
.crumb { height: 28px; padding: 0 5px; border-radius: 6px; color: var(--muted); font-size: 15px; white-space: nowrap; }
.crumb:hover { color: var(--fg); background: var(--pill); }
.crumb.last { color: var(--fg); font-weight: 600; }
.sep { color: var(--muted); font-size: 15px; margin: 0 2px; }
.envchip { height: 20px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 6px; background: var(--pill); color: var(--fg-2); font-size: 12px; margin-left: 4px; }
.page-head { display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; padding: 0 12px 10px; min-height: 28px; }
.page-head .lead { margin: 0; color: var(--muted); }
.page-acts { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn { height: 26px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--ctl-fg); white-space: nowrap; transition: background var(--t-press), color var(--t-press); flex: none; }
.btn:hover { color: var(--fg); background: var(--pill); }
.btn.line { border: 1px solid var(--line); background: var(--card); color: var(--fg-2); box-shadow: 0 1px 1px rgba(0,0,0,.04); }
.btn.line:hover { border-color: var(--muted); color: var(--fg); }
.btn.primary { color: var(--accent-fg); background: var(--accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 22px; padding: 0 8px; font-size: 11.5px; }
.btn.link { padding: 0 4px; height: 20px; color: var(--accent); }
.btn.link:hover { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: .5; pointer-events: none; }
#page { min-height: 0; overflow: hidden; padding: 0 12px; }
#bottom { display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
#status { color: var(--fg-2); }
#hints .k { color: var(--fg-2); } #hints .dot { color: var(--faint); margin: 0 6px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.card-head { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 8px; border-bottom: 1px solid var(--line-2); flex: none; }
.card-head h3 { margin: 0; font-size: 13px; font-weight: 600; }
.card-head .r { margin-left: auto; color: var(--muted); font-size: 12px; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }
.sub-h { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 6px; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .04em; }
.sub-h .r { margin-left: auto; letter-spacing: 0; font-size: 12px; }
.sec { padding: 0 16px 14px; }
.sec-sep { height: 1px; background: var(--line-2); margin: 0 16px; }
.pill { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 11px; background: var(--pill); color: var(--fg-2); }
.pill.cur { background: var(--accent-soft); color: var(--accent); }
.line-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.gdot, .adot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
.gdot { background: var(--green); } .adot { background: var(--amber); }

/* the version buttons */
.vrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vstrip { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--pill); }
.v { height: 24px; min-width: 38px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.v:hover:not(.on) { background: var(--pill-hover); color: var(--fg); }
.v.on { background: var(--seg-thumb); box-shadow: var(--seg-edge); color: var(--accent); font-weight: 600; }
.v .cur { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .7; }

/* collections */
.coll { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 6px; }
.coll .t { display: flex; align-items: center; gap: 8px; }
.coll .t b { font-weight: 600; }
.coll .t .r { margin-left: auto; display: flex; gap: 2px; }
.coll .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.coll .chg { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--amber-soft); color: var(--fg-2); font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.coll .chg b { color: var(--amber); }
.coll .same { margin-top: 6px; font-size: 12px; color: var(--muted); }
.diff { margin-top: 6px; font-size: 12px; display: grid; gap: 2px; }
.diff .a::before { content: "+ "; color: var(--green); font-weight: 600; }
.diff .d::before { content: "− "; color: var(--red); font-weight: 600; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 4%, transparent); }
.seg button { height: 22px; padding: 0 9px; border-radius: 6px; font-size: 11.5px; color: var(--ctl-fg); }
.seg button.on { background: var(--seg-thumb); box-shadow: var(--seg-edge); color: var(--fg); }
.follow { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.addcoll { display: flex; gap: 6px; margin-top: 6px; }
.field { flex: 1; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--muted); }
.field:focus-within { border-color: var(--accent); }

/* export, pack */
.fmts { display: grid; gap: 2px; }
.fmt { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 7px 10px; border-radius: 8px; text-align: left; }
.fmt:hover { background: var(--pill); }
.fmt.on { background: var(--sel); }
.fmt .rd { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--faint); }
.fmt.on .rd { border: 4px solid var(--accent); }
.fmt .nm { font-weight: 500; color: var(--fg); }
.fmt .nm small { font-weight: 400; color: var(--faint); margin-left: 6px; font-size: 11px; }
.fmt .ds { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; }
.fmt .ext { color: var(--faint); font: 11px var(--code); }
pre.prev { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line-2); font: 11.5px/1.55 var(--code); color: var(--fg-2); white-space: pre; overflow: auto; user-select: text; }
.acts-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.packrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; }
.packrow .meta { color: var(--muted); font-size: 12px; }
.packrow .r { margin-left: auto; }

/* layout */
.A { display: grid; grid-template-columns: minmax(270px, 340px) minmax(0, 1fr); gap: var(--card-gap); height: 100%; padding-bottom: 4px; }
.X { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: var(--card-gap); height: 100%; padding-bottom: 4px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding: 8px 12px; margin: 0 4px; border-radius: 8px; text-align: left; width: calc(100% - 8px); }
.lrow:hover { background: var(--pill); }
.lrow.on { background: var(--sel); }
.lrow .n { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lrow .n b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow.on .n b { color: var(--accent); }
.lrow .m { grid-column: 1; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .ri { grid-row: 1 / 3; grid-column: 2; display: flex; align-items: center; color: var(--faint); }
.lrow .ri .warn { color: var(--amber); }
.dhead { padding: 14px 16px 12px; border-bottom: 1px solid var(--line-2); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.dhead h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dhead .facts { grid-column: 1; color: var(--muted); font-size: 12px; }
.dhead .acts { grid-row: 1 / 3; grid-column: 2; display: flex; gap: 6px; }

/* popups */
#veil { position: fixed; inset: 0; background: rgba(10,10,14,.28); display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 30; }
.pop { width: min(560px, calc(100vw - 32px)); background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; animation: pin var(--t-enter) var(--ease); }
@keyframes pin { from { opacity: 0; transform: scale(.98) translateY(4px); } }
.pop h3 { margin: 0; padding: 14px 16px 4px; font-size: 14px; }
.pop .lead { margin: 0; padding: 0 16px 10px; color: var(--muted); font-size: 12px; }
.pop .bd { padding: 0 16px 6px; }
.pop .btns { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 16px 14px; }
.pop .lbl { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .04em; margin: 10px 0 4px; }
.pop textarea { display: block; resize: none; height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; }
.kv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 3px 10px; font-size: 12px; margin: 10px 0; }
.kv span:nth-child(odd) { color: var(--muted); }
.chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--fg-2); }
.chk .box { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--faint); display: inline-flex; align-items: center; justify-content: center; }
.chk.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chk .box svg.i { width: 10px; height: 10px; stroke-width: 2.4; }

@media (max-width: 760px) {
  body { overflow: auto; } #app, #main { display: block; } #side { display: none; } #page { overflow: visible; padding: 0 16px; }
  .A, .X { display: flex; flex-direction: column; height: auto; } .card, .scroll { overflow: visible; } #bottom { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="review"><b>列表管理 · 第二稿</b><span>交互草案 · 示例数据 · 不读写任何文件</span><span class="sp"></span><button class="rb" id="theme">切换深浅色</button></header>
<div id="app">
  <aside id="side">
    <div class="side-head"><button class="navtoggle" aria-label="侧栏"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg></button></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button class="nav-item"><span>后台任务</span></button><button class="nav-item"><span>设置</span></button></div>
  </aside>
  <div id="main">
    <header id="top"><nav id="crumbs"></nav><span class="envchip">main · 1.7</span></header>
    <div class="page-head" id="head"></div>
    <div id="page"></div>
    <footer id="bottom"><span id="status"></span><span style="flex:1"></span><span id="hints"></span></footer>
  </div>
</div>
<div id="veil" hidden></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const VERS = ["1.0", "1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"];
const GAME = "1.7";
const IC = {
  plus: '<path d="M8 3v10M3 8h10"/>', imp: '<path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/>', exp: '<path d="M8 10.5v-8M4.5 6 8 2.5 11.5 6M3 13.5h10"/>',
  steam: '<circle cx="8" cy="8" r="5.8"/><circle cx="10" cy="6.3" r="1.6"/><path d="M2.5 9.6l3.6 1.5"/>', link: '<path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 0 0-3.7-3.7l-.7.7M9.2 6.8a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 0 0 3.7 3.7l.7-.7"/>',
  box: '<path d="M8 1.8 13.5 4.6v6.8L8 14.2 2.5 11.4V4.6z"/><path d="M2.5 4.6 8 7.4l5.5-2.8M8 7.4v6.8"/>', copy: '<rect x="5" y="5" width="8.5" height="8.5" rx="1.6"/><path d="M11 5V3.6A1.1 1.1 0 0 0 9.9 2.5H3.6a1.1 1.1 0 0 0-1.1 1.1v6.3A1.1 1.1 0 0 0 3.6 11H5"/>',
  save: '<path d="M3 2.5h8l2.5 2.5v8.5H3z"/><path d="M5.5 2.5v3.5h4.5V2.5M5 13.5V9.5h6v4"/>', more: '<circle cx="3.5" cy="8" r=".6"/><circle cx="8" cy="8" r=".6"/><circle cx="12.5" cy="8" r=".6"/>',
  edit: '<path d="M10.5 2.8 13.2 5.5 5.8 12.9 2.6 13.4 3.1 10.2z"/>', check: '<path d="M3.2 8.4 6.5 11.6 12.8 4.6"/>', ext: '<path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M12 9.5v3.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-8a.5.5 0 0 1 .5-.5H7"/>',
  chev: '<path d="M6 3.5 10.5 8 6 12.5"/>', list: '<path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 16 16">${IC[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const LISTS = [
  { id: 1, name: "主力殖民地", cur: true, game: "v18", mods: 412, played: "10月21日", born: "9月3日 · 复制自 default v4", decl: ["1.5", "1.6"], created: "1.7", chosen: null,

// allowed versions (04 §1.6): the versions every mod lists plus the game it was made on, as one run
const idx = (v) => VERS.indexOf(v);
function defaults(l) { const ix = [...new Set([...l.decl, l.created])].map(idx).sort((a, b) => a - b); return VERS.slice(ix[0], ix[ix.length - 1] + 1); }
const chosen = (l) => l.chosen || defaults(l);
const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
function fmtVers(vs) {
  const ix = vs.map(idx).sort((a, b) => a - b), out = [];
  for (let i = 0; i < ix.length; i++) { let j = i; while (j + 1 < ix.length && ix[j + 1] === ix[j] + 1) j++; out.push(i === j ? VERS[ix[i]] : VERS[ix[i]] + "–" + VERS[ix[j]]); i = j; }
  return out.join("、") || "—";
}
function toggleVer(l, v) {
  const c = new Set(chosen(l)); c.has(v) ? c.delete(v) : c.add(v);
  if (!c.size) return say("至少要留一个版本");
  const arr = VERS.filter((x) => c.has(x)); l.chosen = same(arr, defaults(l)) ? null : arr;
  say(`${l.name} 允许 ${fmtVers(chosen(l))}`, true); render();
}

function versionBlock(l) {
  const c = chosen(l);
  const chips = VERS.map((v) => {
    const m = l.miss[v], tip = (v === GAME ? "现在的游戏 · " : "") + (m ? `${m} 个 Mod 没写支持 ${v}` : `所有 Mod 都写了支持 ${v}`);
    return `<button class="v ${c.includes(v) ? "on" : ""}" data-ver="${v}" title="${tip}">${v}${v === GAME ? '<span class="cur"></span>' : ""}</button>`;
  }).join("");
  return `<div class="vrow"><div class="vstrip">${chips}</div>${l.chosen ? `<button class="btn link" data-reset title="默认 ${fmtVers(defaults(l))}">恢复默认</button>` : ""}</div>`;
}
function subsBlock(l) {
  const rows = l.subs.map((s, k) => {
    const key = l.id + ":" + k, parts = [];
    if (s.add.length) parts.push(`新增 <b>${s.add.length}</b> 个`); if (s.remove.length) parts.push(`移除 <b>${s.remove.length}</b> 个`);
    return `<div class="coll">

        <span class="r"><button class="btn small" title="在 Steam 打开">${ic("ext")}</button><button class="btn small" data-unlink="${k}">取消关联</button></span></div>
      <div class="meta">上次检查 ${s.checked}${s.notInstalled ? ` · <span class="warn">${s.notInstalled} 个没装</span> <button class="btn link">在工坊订阅</button>` : ""}</div>
      ${parts.length ? `<div class="chg"><span>合集有变化：${parts.join("、")}</span><button class="btn link" data-diff="${key}">${S.showDiff[key] ? "收起" : "看差异"}</button><span style="flex:1"></span><button class="btn small line" data-sync="${k}">跟上合集</button></div>` : `<div class="same">${ic("check")} 和合集一致</div>`}
      ${S.showDiff[key] ? `<div class="diff">${s.add.map((n) => `<div class="a">${esc(n)}</div>`).join("")}${s.remove.map((n) => `<div class="d">${esc(n)}</div>`).join("")}</div>` : ""}

    </div>`;

}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) { if (ev.target.id === "veil") closePop(); return; }
  const d = t.dataset, l = cur();
  if (d.sel) { S.sel = +d.sel; S.sub = null; return render(); }
  if (d.ver) return toggleVer(l, d.ver);
  if ("reset" in d) { l.chosen = null; say(`${l.name} 恢复默认 ${fmtVers(chosen(l))}`, true); return render(); }
  if (d.diff) { S.showDiff[d.diff] = !S.showDiff[d.diff]; return render(); }
  if (d.sync) { const s = l.subs[+d.sync], a = s.add.length, r = s.mode === "follow" ? s.remove.length : 0; l.mods += a - r; s.add = []; s.remove = []; say(`${l.name} 跟上「${s.title}」：启用 ${a} 个${r ? `，停用 ${r} 个` : ""}`, true); return render(); }
  if (d.mode) { const [k, m] = d.mode.split(":"); l.subs[+k].mode = m; return render(); }
  if (d.unlink) { const s = l.subs.splice(+d.unlink, 1)[0]; say(`「${s.title}」不再关联 ${l.name}；列表不变`); return render(); }
  if ("link" in d) { l.subs.push({ title: "Combat Extended 兼容包", n: 52, checked: "刚刚", mode: "add", notInstalled: 2, add: [], remove: [] }); say(`${l.name} 跟着「Combat Extended 兼容包」`); return render(); }
  if (d.fmt) { S.fmt = d.fmt; return render(); }
  if (d.dest) { S.imp.dest = d.dest; return render(); }
  if ("follow" in d) { S.imp.follow = !S.imp.follow; return render(); }
  switch (d.do) {
    case "new": return openPop("new");
    case "import": return openPop("import");
    case "menu": return openPop("menu");
    case "close": return closePop();
    case "create": closePop(); return say(`新建「新列表 1」：复制自 ${l.name}`, true);
    case "sample": S.imp = { dest: "new", follow: true }; return openPop("import");
    case "imp-go": S.imp = null; closePop(); return say("导入为新列表「Warhammer 40K Collection」：219 个 Mod，允许 1.6–1.7", true);
    case "export": S.sub = "export"; return render();
    case "back": S.sub = null; return render();
    case "copy": return say("已复制到剪贴板");
    case "save": return say(`已保存 ${l.name}${FMTS.find((x) => x.k === S.fmt).ext}`);
    case "pack": return say(`去 库 / 列表 / ${l.name} / 创建整合包`);
    case "edit": return say(`打开 ${l.name} 的编辑器`);
    case "use": LISTS.forEach((x) => (x.cur = x.id === l.id)); say(`${l.name} 成为当前列表；没写游戏文件`); return render();
  }
});
$("#theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "Escape") { if (S.pop) closePop(); else if (S.sub) { S.sub = null; render(); } return; }
  if (S.sub || S.pop) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { const i = LISTS.findIndex((x) => x.id === S.sel); S.sel = LISTS[(i + (e.key === "ArrowDown" ? 1 : LISTS.length - 1)) % LISTS.length].id; render(); e.preventDefault(); }
  if (e.key === "n") openPop("new");
  if (e.key === "i") openPop("import");
  if (e.key === "e") { S.sub = "export"; render(); }
});
render();
</script>
</body>
</html>
