<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>subscriptions and updates B</title>
<link rel="stylesheet" href="shared.css">
<style>
/* B: three views, one per reason to open the page. Updates and changes are a list and a detail;
   adding is its own guided view. */
#top { display: grid; grid-template-columns: 1fr auto 1fr; }
#top .seg { padding: 3px; border-radius: 9px; }
#top .seg button { height: 26px; padding: 0 14px; font-size: 12.5px; }
#top .seg .badge-n { margin: 0 -4px 0 2px; }
.split { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: var(--card-gap); height: 100%; }
.lrow { grid-template-columns: minmax(0, 1fr) auto; width: calc(100% - 8px); }
.lrow .m { grid-column: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 10px; }
.lrow .ri { grid-row: 1 / 3; grid-column: 2; display: flex; align-items: center; gap: 6px; }
.lrow.sel .nm { color: var(--accent); }
.foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line-2); color: var(--muted); font-size: 12px; }
.srcsum { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; border-radius: 6px; color: var(--muted); }
.srcsum:hover { background: var(--pill); color: var(--fg); }
.dhead { padding: 14px 16px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border-bottom: 1px solid var(--line-2); }
.dhead h2 { margin: 0; font-size: 17px; font-weight: 600; }
.dhead .facts2 { grid-column: 1; color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.dhead .acts { grid-row: 1 / 3; grid-column: 2; display: flex; gap: 6px; }
.sec { padding: 0 16px 14px; display: grid; gap: 8px; }
.log { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 10px; font-size: 12.5px; }
.log code { color: var(--muted); font-size: 11.5px; }
.log .d { color: var(--faint); font-size: 12px; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 10px; font-size: 12.5px; }
.kv > :nth-child(odd) { color: var(--muted); }
.tierh { display: flex; align-items: center; gap: 8px; padding: 10px 14px 4px; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }

/* the add view */
.addv { height: 100%; overflow-y: auto; }
.addv .col { max-width: 720px; margin: 0 auto; padding: 28px 0 24px; display: grid; gap: 12px; }
.addv h2 { margin: 0; font-size: 18px; font-weight: 600; }
.addv .lead2 { margin: -6px 0 4px; color: var(--muted); }
.addv .omni { height: 46px; font-size: 14px; border-radius: 12px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--card-gap); }
.tile { display: grid; gap: 6px; align-content: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); width: 100%; transition: border-color var(--t-press); }
.tile:hover { border-color: var(--muted); }
.tile .t { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.tile .t svg.i { color: var(--muted); width: 16px; height: 16px; }
.tile .w { color: var(--fg-2); font-size: 12px; }
.tile code { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.tile .st { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.local { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
.local svg.i { color: var(--faint); }
.recent { display: grid; gap: 0; }
.recent .r { display: flex; gap: 10px; align-items: center; padding: 5px 4px; font-size: 12px; color: var(--muted); }
.recent .r b { color: var(--fg-2); font-weight: 500; }
@media (max-width: 1000px) { .tiles { grid-template-columns: 1fr; } .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="review"><b>subscriptions and updates · B: three views by intent</b><span>example data; no file reads or writes</span><span class="sp"></span>
  <a href="a.html">A</a><a href="b.html" class="on">B</a><a href="c.html">C</a><button class="rb" id="theme">light / dark</button></header>
<div id="app">
  <aside id="side"><div class="side-head"></div><nav id="nav"></nav></aside>
  <div id="main">
    <header id="top"><nav id="crumbs"></nav><div class="seg" id="views"></div><span></span></header>
    <div class="page-head" id="head"></div>
    <div id="page"></div>
    <footer id="bottom"><span id="status"></span><span style="flex:1"></span><span id="hints"></span></footer>
  </div>
</div>
<div id="veil" hidden></div>
<script src="shared.js"></script>
<script>
const S = { view: "upd", sel: { upd: "pf", chg: "vef" }, done: new Set(), text: "", st: {}, scope: 0, checking: false, pick: new Set() };
const pending = () => PENDING.filter((p) => !S.done.has(p.id));
const changes = () => (S.scope ? CHANGES : CHANGES.filter((c) => c.used.includes("Main colony")));

function views() {
  const V = [["upd", "updates", pending().length, "1"], ["chg", "changes", changes().length, "2"], ["add", "add", 0, "+"]];
  $("#views").innerHTML = V.map(([k, t, n, key]) => `<button class="${S.view === k ? "on" : ""}" data-view="${k}" title="${key}">${k === "add" ? ic("plus") : ""}${t}${n ? `<span class="badge-n ${k === "upd" ? "acc" : ""}" style="${k === "chg" ? "color:var(--muted);background:var(--pill)" : ""}">${n}</span>` : ""}</button>`).join("");
}
function head() {
  const check = `<button class="btn line" data-do="check">${S.checking ? `<span class="spin" style="display:inline-flex">${ic("refresh")}</span>checking…` : `${ic("refresh")}check for updates`}<kbd>R</kbd></button>`;
  if (S.view === "upd") $("#head").innerHTML = `<p class="lead">RimArcho updates Git, LoversLab and SteamCMD mods; Steam updates Workshop mods, shown in changes</p><div class="page-acts">${check}</div>`;
  else if (S.view === "chg") $("#head").innerHTML = `<p class="lead">Mods updated by Steam or you since Main colony was last played Oct 22</p>
    <div class="seg">${["current list", "whole library"].map((x, i) => `<button class="${S.scope === i ? "on" : ""}" data-scope="${i}">${x}</button>`).join("")}</div><div class="page-acts"><button class="btn">${ic("refresh")}rescan<kbd>R</kbd></button></div>`;
  else $("#head").innerHTML = "";
}

function updView() {
  const P = pending(), cur = P.find((p) => p.id === S.sel.upd) || P[0];
  const list = P.length ? P.map((p) => `<button class="row lrow ${cur === p ? "sel" : ""}" data-sel="${p.id}">
      <span class="nm">${esc(p.n)}</span><span class="m">${src(p.s)}<span>${p.from} → ${p.to}</span></span>
      <span class="ri">${p.s === "ll" ? '<span class="pill">choose a file</span>' : ""}<span class="muted" style="font-size:12px">${p.toD}</span></span></button>`).join("")
    : `<div class="empty"><span class="ok">${ic("check")}</span> All up to date. Go to add for new subscriptions</div>`;
  return `<div class="split">
    <section class="card"><div class="card-head"><h3>waiting for you to update <span class="n">${P.length}</span></h3><span class="r"><button class="btn primary small" data-do="all" ${P.length ? "" : "disabled"}>update all<kbd style="color:inherit;opacity:.7">U</kbd></button></span></div>
      <div class="scroll" style="padding-bottom:6px">${list}</div>
      <div class="foot"><button class="srcsum" data-do="sources">${ic("clock")}4 sources checked at 14:02${ic("down")}</button><span class="warn" style="margin-left:auto;display:inline-flex;gap:4px;align-items:center">${ic("warn")}2 Workshop items unavailable</span></div></section>
    <section class="card">${cur ? updDetail(cur) : '<div class="empty">select a mod to see changes</div>'}</section></div>`;
}
function updDetail(p) {
  const main = p.s === "ll" ? "download and update" : "updates";
  let body = "";
  if (p.kind === "commits") body = `<div class="sub-h">what changed<span class="r">${p.log.length} commits</span></div><div class="sec"><div class="log">${p.log.map(([h, m, d]) => `<code>${h}</code><span>${esc(m)}</span><span class="d">${d}</span>`).join("")}</div>
    <div class="note">${ic("info")}<span>inferred from changed files: ${p.impact}</span></div></div>`;
  else if (p.kind === "files") body = `<div class="sub-h">what changed</div><div class="sec"><div style="color:var(--fg-2)">${esc(p.note)}</div><div class="muted" style="font-size:12px">${p.impact}</div></div>
    <div class="sub-h">which file</div><div class="sec"><div class="choice">${p.files.map(([n, s, d, same], i) => `<button class="opt ${(S.st[p.id] ?? 0) === i ? "on" : ""}" data-pfile="${p.id}:${i}"><span class="rd"></span><span class="nm">${n}${same ? "<small>same name as last download</small>" : ""}</span><span class="ext">${s}  ${d}</span></button>`).join("")}</div>
    <div class="facts"><div class="f"><span class="ok">✓</span><span>signed in to LoversLab (expires Nov 30). Site download terms appear before downloading</span></div></div>
    <div><button class="btn small">or choose a downloaded zip…</button><button class="btn small">${ic("ext")}open download page</button></div></div>`;
  else body = `<div class="sub-h">what changed</div><div class="sec"><div style="color:var(--fg-2)">${esc(p.note)}</div><div class="muted" style="font-size:12px">${p.impact}; after download, changes are explained by file in changes</div></div>`;
  return `<div class="dhead"><h2>${esc(p.n)}</h2>
      <div class="facts2">${src(p.s)}<span>${p.from}${p.fromD ? " (" + p.fromD + ")" : ""} → <b style="font-weight:600;color:var(--fg)">${p.to}</b>${p.toD ? " (" + p.toD + ")" : ""}</span>${p.track ? `<span>tracking ${p.track}</span>` : ""}</div>
      <div class="acts"><button class="btn primary" data-upd="${p.id}">${main}<kbd style="color:inherit;opacity:.7">u</kbd></button></div></div>
    <div class="scroll">${body}
      <div class="sub-h">used in</div><div class="sec"><div style="display:flex;gap:6px;flex-wrap:wrap">${p.used.map((u) => `<span class="pill">${u}</span>`).join("")}</div>
        <div class="muted" style="font-size:12px">Updating replaces this copy in Mods. To keep the old version, lock it first</div>
        <div><button class="btn line small">lock this version first</button>${p.s === "git" ? `<button class="btn small">${ic("ext")}compare on GitHub</button>` : ""}<button class="btn small">show in the mod library</button></div></div>
    </div>`;
}

function chgView() {
  const C = changes(), cur = C.find((c) => c.id === S.sel.chg) || C[0];
  const rows = [1, 2, 3].map((t) => {
    const g = C.filter((c) => c.t === t);
    return g.length ? `<div class="tierh"><span class="pill tier${t}">${TIER[t]}</span><span>${g.length}</span></div>` + g.map((c) => `<button class="row lrow ${cur === c ? "sel" : ""}" data-csel="${c.id}">
      <span class="nm">${esc(c.n)}</span><span class="m"><span>${esc(c.say)}</span></span><span class="ri"><span class="when">${c.when}</span></span></button>`).join("") : "";
  }).join("");
  return `<div class="split">
    <section class="card"><div class="scroll" style="padding:2px 0 6px">${rows}
      <div class="tierh"><span class="pill">subscription changes</span></div>
      <button class="row lrow" data-csel="arr"><span class="nm" style="font-weight:500">${ARRIVALS.add.length} new subscriptions, ${ARRIVALS.gone.length} missing</span><span class="m"><span>${ARRIVALS.add.concat(ARRIVALS.gone).join(", ")}</span></span></button>
      <div class="tierh">earlier</div>
      ${OLDER.map((o) => `<button class="row lrow"><span>${o.day}</span><span class="m"><span>${o.n} mods</span></span><span class="ri faint">${ic("chev")}</span></button>`).join("")}
    </div></section>
    <section class="card">${S.sel.chg === "arr" ? arrDetail() : cur ? `<div class="dhead"><h2>${esc(cur.n)}</h2>
        <div class="facts2"><span class="pill tier${cur.t}">${TIER[cur.t]}</span>${src("ws")}<span>Steam updated at ${cur.when}</span></div>
        <div class="acts"><button class="btn line">${ic("ext")}Workshop change notes<kbd>ctrl+w</kbd></button></div></div>
      <div class="scroll"><div class="sub-h">what it means</div><div class="sec"><div style="color:var(--fg-2)">${esc(cur.say)}</div>
        ${cur.t === 1 ? `<div class="note amber">${ic("warn")}<span>Check can it run before launch: code and dependencies changed, the most likely trouble spots</span><button class="btn link">go to can it run →</button></div>` : ""}</div>
        <div class="sub-h">what changed<span class="r"><button class="btn small">every file<kbd>i</kbd></button></span></div><div class="sec"><div class="kv">${cur.groups.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join("")}</div></div>
        <div class="sub-h">used in</div><div class="sec"><div style="display:flex;gap:6px;flex-wrap:wrap">${cur.used.map((u) => `<span class="pill">${u}</span>`).join("")}</div>
          <div class="muted" style="font-size:12px">Do not want this update? Steam kept no old version; lock it before future updates</div>
          <div><button class="btn line small">lock this version first<kbd>p</kbd></button><button class="btn small">show in the mod library</button></div></div></div>` : ""}</section></div>`;
}
function arrDetail() {
  return `<div class="dhead"><h2>subscription changes</h2><div class="facts2"><span>since Oct 22</span></div></div><div class="scroll">
    <div class="sub-h">new subscription</div><div class="sec">${ARRIVALS.add.map((n) => `<div>${src("ws")}  ${n}</div>`).join("")}</div>
    <div class="sub-h">no longer here</div><div class="sec">${ARRIVALS.gone.map((n) => `<div>${n}  <span class="err">Main colony still uses it; affects launch</span></div>`).join("")}
      <div><button class="btn line small">disable in every list</button><button class="btn small">${ic("ext")}resubscribe in Workshop</button></div></div></div>`;
}

function addView() {
  const k = detect(S.text);
  if (!k) found.last = null;
  return `<div class="addv"><div class="col">
    <h2>add a subscription</h2><p class="lead2">Paste an address. RimArcho recognizes it, where to download it and how to check updates later.</p>
    <label class="omni">${ic("link")}<input id="omni" placeholder="paste a GitHub repository, a LoversLab file page, a Workshop link or ID" value="${esc(S.text)}" spellcheck="false"></label>
    ${k ? found(k, S.st) : `<div class="tiles">
      <button class="tile" data-sample="git"><span class="t">${ic("git")}Git repository</span><span class="w">Mods published on GitHub, or development versions. Future updates download only changes</span><code>github.com/author/repository</code><span class="st">no account needed</span></button>
      <button class="tile" data-sample="ll"><span class="t">${ic("globe")}LoversLab</span><span class="w">A mod published only on LoversLab. Paste its file page and choose a file; RimArcho tells you when a new version is out.</span><code>loverslab.com/files/file/…</code><span class="st"><span class="ok">${ic("check")}</span>signed in, expires Nov 30</span></button>
      <button class="tile" data-sample="ws"><span class="t">${ic("steam")}Workshop item</span><span class="w">Subscribe with Steam; without the Steam client, download with SteamCMD.</span><code>steamcommunity.com/…?id=… or ID</code><span class="st"><span class="ok">${ic("check")}</span>Steam running, SteamCMD account rim_player</span></button>
    </div>`}
    <div class="local">${ic("zip")}<span>Downloaded zip: drop into window.</span>${ic("folder")}<span>Local mods need no subscription: copy them into the Mods folder and the next scan finds them.</span><button class="btn link" data-do="mods">open the Mods folder</button></div>
    <div class="sub-h" style="padding:10px 0 0">recently added</div>
    <div class="recent"><div class="r">${src("git")}<b>Performance Fish</b><span>10/12</span></div><div class="r">${src("ll")}<b>Body Shape Patch</b><span>09/02</span></div><div class="r">${src("cmd")}<b>Combat Extended</b><span>08/20</span></div></div>
  </div></div>`;
}

function render() {
  nav(pending().length || "");
  views(); head();
  const a = document.activeElement?.id;
  $("#page").innerHTML = S.view === "upd" ? updView() : S.view === "chg" ? chgView() : addView();
  if (a === "omni" || (S.view === "add" && !S.text)) { const i = $("#omni"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  hints(S.view === "upd" ? [["1 2 +", "updates / changes / add"], ["↑↓", "select mod"], ["u", "updates"], ["U", "update all"], ["R", "check for updates"]]
    : S.view === "chg" ? [["1 2 +", "updates / changes / add"], ["↑↓", "select mod"], ["ctrl+w", "Workshop change notes"], ["i", "every file"], ["a", "current list / whole library"]]
    : detect(S.text) ? [["enter", "subscribe to it"], ["esc", "cancel"]] : [["ctrl+v", "paste"], ["1 2", "updates / changes"]]);
}
function setText(t) { S.text = t; S.st = {}; render(); }

document.addEventListener("input", (e) => { if (e.target.id === "omni") setText(e.target.value); if (e.target.dataset.from !== undefined) { S.st.from = !!e.target.value; render(); } });
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-do],[data-sample],[data-view],[data-sel],[data-csel],[data-upd],[data-track],[data-file],[data-via],[data-pfile],[data-scope]");
  if (!b) { if (!e.target.closest(".popover")) $("#veil").hidden = true; return; }
  const d = b.dataset;
  if (d.view) { S.view = d.view; return render(); }
  if (d.sample) { S.view = "add"; return setText(SAMPLES[d.sample]); }
  if (d.sel) { S.sel.upd = d.sel; return render(); }
  if (d.csel) { S.sel.chg = d.csel; return render(); }
  if (d.scope) { S.scope = +d.scope; return render(); }
  if (d.track) { S.st.track = +d.track; return render(); }
  if (d.file) { S.st.file = +d.file; return render(); }
  if (d.via) { S.st.via = +d.via; return render(); }
  if (d.pfile) { const [id, i] = d.pfile.split(":"); S.st[id] = +i; return render(); }
  if (d.upd) { const p = PENDING.find((x) => x.id === d.upd); S.done.add(p.id); say(`queued background task: update ${p.n} (${p.from} → ${p.to})`); return render(); }
  if (d.do === "clear") return setText("");
  if (d.do === "add") { say(detect(S.text) === "zip" ? "added Gene Tweaks" : "queued subscription; scan on completion"); return setText(""); }
  if (d.do === "all") { pending().filter((p) => p.s !== "ll").forEach((p) => S.done.add(p.id)); S.sel.upd = "bs"; say("queued update for 3; choose files first for Body Shape Patch"); return render(); }
  if (d.do === "check") { S.checking = true; render(); setTimeout(() => { S.checking = false; say("check complete: no new updates"); render(); }, 1400); return; }
  if (d.do === "sources") { e.stopPropagation(); return sourcesPopover(b); }
  if (d.do === "mods") return say("opened Mods folder");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (!$("#veil").hidden) $("#veil").hidden = true; else if (S.text) setText(""); else if (S.view === "add") { S.view = "upd"; render(); } }
  if (e.key === "Enter" && S.view === "add" && detect(S.text) && detect(S.text) !== "bad") $('[data-do="add"]')?.click();
  if (e.target.tagName === "INPUT") return;
  const step = (list, key) => { const i = list.findIndex((x) => x.id === S.sel[key]); const n = list[Math.max(0, Math.min(list.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))]; if (n) { S.sel[key] = n.id; render(); } };
  if (e.key === "1") { S.view = "upd"; render(); } else if (e.key === "2") { S.view = "chg"; render(); } else if (e.key === "+") { S.view = "add"; render(); e.preventDefault(); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && S.view !== "add") { e.preventDefault(); S.view === "upd" ? step(pending(), "upd") : step(changes(), "chg"); }
  else if (e.key === "u" && S.view === "upd") $("[data-upd]")?.click();
  else if (e.key === "U") { S.view = "upd"; render(); $('[data-do="all"]')?.click(); }
  else if (e.key === "R") $('[data-do="check"]')?.click();
  else if (e.key === "a" && S.view === "chg") { S.scope = 1 - S.scope; render(); }
});
document.addEventListener("paste", (e) => { if (e.target.tagName !== "INPUT") { S.view = "add"; setText(e.clipboardData.getData("text")); } });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); S.view = "add"; setText(SAMPLES.zip); });
themeButton();
render();
</script>
</body>
</html>
