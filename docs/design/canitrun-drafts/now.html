<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>can it run · now</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="review" id="review"></div>
<div id="app">
  <aside id="side"><div class="side-head">RimArcho</div><nav id="nav"></nav></aside>
  <main id="main" class="narrow">
    <div id="top"></div><div class="page-head" id="head"></div><div id="page"></div>
    <div id="bottom"><span id="status"></span><span id="hints"></span></div>
  </main>
</div>
<div id="toast"></div>
<script src="shared.js"></script>
<script>
// Today's page (16 §2.4): one column, four sections by consequence. Uncounted items (shared-log
// hints, weak order, the cycle) sit dimmed inside breaks the game; the link panel lists every game.
const ORDER = ["break", "run", "confirm", "hidden"];
const LIST = ORDER.flatMap((s) => ITEMS.filter((it) => (it.now || it.sec) === s));
const sec = (it) => it.now || it.sec;
let cur = 0;
const open = new Set();
const n = LIST.filter((x) => x.counted && sec(x) !== "hidden").length;

shell("now", n, [["↑↓", "move"], ["← →", "change section"], ["enter", "primary action"], ["A", "recheck"], ["l", "game log"]],
  "Now: four sections in one column. Uncounted hints are muted inside breaks the game; link panel lists all games.");
$("#head").innerHTML = `<p class="lead"><b>${PLAN}</b>fix ${n} problems below before playing</p>
  <div class="page-acts"><button class="btn primary small">${ic("wand")} fix 2 automatically</button><button class="btn small">${ic("refresh")} recheck files</button><button class="btn small">${ic("log")} game log</button></div>`;

function draw() {
  let html = "", i = 0;
  for (const s of ORDER) {
    const its = LIST.filter((x) => sec(x) === s);
    if (!its.length) continue;
    const c = its.filter((x) => x.counted && s !== "hidden").length;
    html += `<section class="${SEC[s].cls}"><h2 class="label">${SEC[s].t}${c ? `<span class="n">${c}</span>` : ""}${SEC[s].r ? `<span class="n">${SEC[s].r}</span>` : ""}</h2><div class="card">`;
    let phase = "";
    for (const it of its) {
      if (it.phase && it.phase !== phase) html += `<div class="phase">${it.phase}</div>`;
      phase = it.phase || phase;
      html += needHTML(it, i++, { open, links: (x) => [...x.links, x.otherGame] });
    }
    html += `</div></section>`;
  }
  $("#page").innerHTML = html;
  mark();
}
function mark() {
  $$(".need").forEach((r) => r.classList.toggle("cur", +r.dataset.i === cur));
  $(`.need[data-i="${cur}"]`)?.scrollIntoView({ block: "nearest" });
}
const setCur = (i) => { cur = i; mark(); };
bindRows($("#page"), LIST, setCur, (it, a) => {
  if (a.l === "expand") { open.has(it.id) ? open.delete(it.id) : open.add(it.id); draw(); }
  else toast(`would run: ${a.l}`);
});
keyNav(() => LIST.length, () => cur, setCur, (i) => sec(LIST[i]), (i) => LIST[i].acts && toast(`would run: ${LIST[i].acts[0].l}`));
draw();
</script>
</body>
</html>
