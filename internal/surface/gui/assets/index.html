<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RimArcho</title>
<link rel="icon" href="/icon-small.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img src="/icon.svg" alt=""><span>RimArcho</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="nav-settings" class="nav-item" data-page="settings"><span class="lbl"></span></button>
      <button id="live" class="runbox"><span class="env"></span><span class="run"></span></button>
    </div>
  </aside>
  <div id="scrim" hidden></div>
  <div id="main">
    <header id="top">
      <button id="collapse" class="icon" title="Sidebar"></button>
      <nav id="crumbs"></nav>
      <button id="env" class="pill" title="E"></button>
      <span class="grow"></span>
      <div id="acts"></div>
      <button id="btn-launch" class="btn primary" data-cmd="launch" title="L"></button>
    </header>
    <div id="body">
      <main id="board">
        <section class="area list" data-area="0"><div class="head"></div><div class="search"><input spellcheck="false"></div><div class="rows" tabindex="-1"></div></section>
        <div class="split" data-split="0"></div>
        <section class="area list" data-area="1"><div class="head"></div><div class="search"><input spellcheck="false"></div><div class="rows" tabindex="-1"></div></section>
        <div class="split" data-split="1"></div>
        <section class="area list" data-area="2"><div class="head"></div><div class="search"><input spellcheck="false"></div><div class="rows" tabindex="-1"></div></section>
        <div class="split" data-split="2"></div>
        <section class="area detail" data-area="3"><div class="head"></div><div class="scroll" tabindex="-1"><div id="detail"></div></div></section>
      </main>
      <div id="screen" hidden></div>
    </div>
    <footer id="bottom"><span id="where" class="where"></span><span id="status"></span><span class="grow"></span><span id="hints"></span></footer>
  </div>
  <div id="popup" hidden></div>
  <div id="menu" hidden></div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
