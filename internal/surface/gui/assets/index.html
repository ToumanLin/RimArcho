<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RimArcho</title>
<link rel="icon" href="/icon-small.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <span class="brand"><img class="logo" src="/icon-small.svg" alt="">RimArcho</span>
    <button id="env" class="pill" title="E"></button>
    <button id="needs" class="badge" title="!"></button>
    <span id="unsaved" class="badge quiet"></span>
    <span id="live" class="badge live" hidden></span>
    <span id="where" class="where"></span>
    <span class="grow"></span>
    <button id="btn-packs" class="tb" data-cmd="packs"></button>
    <button id="btn-settings" class="tb" data-cmd="settings" title="settings">⚙</button>
    <button id="btn-sort" class="tb" data-cmd="sort"></button>
    <button id="btn-save" class="tb" data-cmd="save"></button>
    <button id="btn-launch" class="tb primary" data-cmd="launch"></button>
  </header>
  <main id="board">
    <section class="area list" data-area="0"><div class="head"></div><div class="search"><input spellcheck="false"></div><div class="rows" tabindex="-1"></div></section>
    <div class="split" data-split="0"></div>
    <section class="area list" data-area="1"><div class="head"></div><div class="search"><input spellcheck="false"></div><div class="rows" tabindex="-1"></div></section>
    <div class="split" data-split="1"></div>
    <section class="area list" data-area="2"><div class="head"></div><div class="search"><input spellcheck="false"></div><div class="rows" tabindex="-1"></div></section>
    <div class="split" data-split="2"></div>
    <section class="area detail" data-area="3"><div class="head"></div><div class="scroll" tabindex="-1"><div id="detail"></div></div></section>
  </main>
  <div id="screen" hidden></div>
  <footer id="bottom"><span id="status"></span><span class="grow"></span><span id="hints"></span></footer>
  <div id="popup" hidden></div>
  <div id="menu" hidden></div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
