<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RimArcho</title>
<link rel="icon" href="/icon-small.svg" type="image/svg+xml">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="side-split"></div>
    <div class="side-head"><button id="navtoggle" class="navtoggle" aria-label="Sidebar"></button></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="tasks-line" class="nav-item tasks-line" hidden></button>
      <button id="nav-settings" class="nav-item" data-page="settings"><span class="lbl"></span></button>
    </div>
  </aside>
  <div id="main">
    <header id="top">
      <nav id="crumbs"></nav>
      <button id="env" class="envchip" title="E"></button>
    </header>
    <div id="body">
      <div id="planhead" class="page-head" hidden><p class="lead"></p><div class="page-acts"></div></div>
      <main id="board" tabindex="-1">
        <div class="fcol stack editor-left" data-col="detail">
          <div class="barhost"></div>
          <section class="area detail" data-area="3"><div class="head"></div><div class="scroll" tabindex="-1"><div id="detail"></div></div></section>
          <section class="area fold rulesarea"><button class="head hbar"></button><div class="rulesbody"></div></section>
          <section class="area fold histarea"><button class="head hbar"></button><div class="histbody"></div></section>
        </div>
        <div class="split" data-split="0"></div>
        <section class="area list" data-area="1"><div class="head"></div><div class="rows" tabindex="-1"></div></section>
        <div class="split" data-split="1"></div>
        <div class="stack editor-right">
          <section class="area list" data-area="0"><div class="head"></div><div class="rows" tabindex="-1"></div></section>
          <section class="area list fold" data-area="2"><div class="head" role="button" tabindex="-1"></div><div class="search"><input spellcheck="false"></div><div class="rows" tabindex="-1"></div></section>
        </div>
      </main>
      <div id="screen" aria-busy="true" tabindex="-1"></div>
    </div>
    <footer id="bottom"><span id="where" class="where"></span><span id="status" role="status" aria-live="polite" aria-atomic="true"></span><span class="grow"></span><span id="hints"></span></footer>
  </div>
  <div id="popup" hidden></div>
  <div id="menu" hidden></div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
