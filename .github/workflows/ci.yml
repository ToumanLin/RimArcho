name: CI

on:
  push:
    branches: [master, "dev/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (17 §5): stamped into rimarcho, and builds (and signs) the Windows ZIP; empty builds dev"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A release dispatch waits for the SignPath approval; a push to the same branch must not
  # cancel it, so dispatches and pushes queue apart.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    # RimArcho is Windows-only: the GUI (wails/WebView2) and several packages build only there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The GUI tests drive their page scripts with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: gofmt
        shell: bash
        run: |
          out=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Settings are in staticcheck.conf at the repository root.
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: go test
        run: go test -timeout 20m ./...

  race:
    # The race detector over the packages with concurrency (17 §4): the Windows runner's
    # MinGW gcc builds cgo. Shared state that two Apps or a background task and a request
    # touch at once fails here, not as a flaky test later.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: go test -race
        run: go test -race -count=1 -timeout 40m ./internal/...

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Select non-GUI packages
        run: |
          go list -e ./... | grep -Ev '/(internal/surface/gui|spikes)(/|$)' > "$RUNNER_TEMP/linux-packages"

      - name: go build
        run: go build ./cmd/archo

      - name: go vet
        run: xargs go vet < "$RUNNER_TEMP/linux-packages"

      - name: staticcheck
        run: xargs go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 < "$RUNNER_TEMP/linux-packages"

      - name: go test
        run: xargs go test -count=1 -timeout 20m < "$RUNNER_TEMP/linux-packages"

  linux-gui:
    # The Linux GUI, rimarcho (16 §8.1, 17 §5): Wails' Linux code calls GTK 3 and WebKitGTK 4.1
    # through cgo, so this is the one build with CGO_ENABLED=1 (17 §1, decision D7). Ubuntu
    # 22.04 is the oldest distribution supported (D4): its glibc sets the binary's floor.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The GUI tests drive their page scripts with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: GTK 3 and WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1

      - name: go vet
        run: go vet -tags gtk3 ./cmd/archo ./internal/surface/cli ./internal/surface/gui ./internal/surface/upgradewin

      - name: go build rimarcho
        # A release dispatches this workflow with its version (17 §5); a push builds "dev".
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: |
          pkg=github.com/ToumanLin/RimArcho/internal/buildinfo
          go build -tags gtk3 -trimpath -o rimarcho \
            -ldflags "-s -w -X $pkg.Version=$VERSION -X $pkg.Commit=${GITHUB_SHA::12} -X $pkg.Date=$(date -u +%F) -X $pkg.GUI=1" \
            ./cmd/archo
          ldd rimarcho | grep -E 'webkit2gtk|gtk-3'
          objdump -T rimarcho | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: go test
        # TestSideButtonsHookGTK drives real GTK and WebKitGTK widgets, so the tests need a display.
        run: xvfb-run -a go test -tags gtk3 -count=1 -timeout 20m ./internal/surface/gui ./internal/surface/cli ./internal/surface/upgradewin

      - uses: actions/upload-artifact@v4
        with:
          name: rimarcho-linux-amd64
          path: rimarcho
          if-no-files-found: error
          retention-days: 30

  windows-release:
    # The Windows release ZIP (17 §5), built by the same scripts/release.ps1 the maintainer runs,
    # so SignPath Foundation can sign what CI built from the public source
    # (scripts/signpath/README.md). Only a dispatch with a version builds it; the run's other
    # jobs are the test gate: release.ps1 -FromCI takes only a run that succeeded as a whole.
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # SignPath's action reads the unsigned artifact
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Archo Monitor (monitor/build.ps1): .NET SDK 10; the game's reference assemblies come
      # from NuGet (Krafs.Rimworld.Ref), Harmony from Lib.Harmony; neither is shipped.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Build the release folder
        shell: pwsh
        run: ./scripts/release.ps1 -Version $env:VERSION -SkipTests -StageOnly

      - name: Read Monitor's version
        id: monitor
        shell: pwsh
        run: '"version=$((Get-Content monitor/VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT'

      # SignPath signs files from a GitHub artifact of this run. The folder's contents are at
      # the artifact's root (scripts/signpath/artifact-configuration.xml).
      - name: Upload the unsigned folder
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: archo-windows-amd64-unsigned
          path: dist/archo-${{ inputs.version }}-windows-amd64/
          if-no-files-found: error
          retention-days: 7

      # Inert until the maintainer sets the repository variable SIGNPATH_ORGANIZATION_ID
      # (and the others below, plus the secret SIGNPATH_API_TOKEN): scripts/signpath/README.md.
      # The project's default artifact configuration is scripts/signpath/artifact-configuration.xml.
      # The request waits for the approver's click on signpath.io (release-signing policy).
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(inputs.version) }}
            monitorVersion: ${{ toJSON(steps.monitor.outputs.version) }}

      - name: Use the signed files
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $out = "dist/archo-$env:VERSION-windows-amd64"
          $want = @(Get-ChildItem -LiteralPath $out -Recurse -File).Count
          $got = @(Get-ChildItem -LiteralPath signed -Recurse -File).Count
          if ($got -ne $want) { throw "SignPath returned $got files, the folder has $want" }
          Remove-Item -Recurse -Force $out
          Move-Item signed $out
          $files = @("archo.exe", "RimArcho.exe") + @(Get-ChildItem "$out/monitor/ArchoMonitor/*/Assemblies/ArchoMonitor.dll" | ForEach-Object { $_.FullName.Substring((Resolve-Path $out).Path.Length + 1) })
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $out $f)
            "{0}: {1} {2}" -f $f, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed" }
          }

      - name: Package
        shell: pwsh
        run: ./scripts/release.ps1 -Version $env:VERSION -PackageOnly

      # scripts/release.ps1 -FromCI downloads this one by name.
      - uses: actions/upload-artifact@v4
        with:
          name: archo-windows-amd64
          path: |
            dist/archo-${{ inputs.version }}-windows-amd64.zip
            dist/archo-${{ inputs.version }}-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 30
